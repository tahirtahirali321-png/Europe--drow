<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europe Draw - Premium Lottery & Lucky Draw</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #f59e0b;
            --: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            direction: ltr;
            text-align: left;
        }
        .screen {
            display: none;
            max-width: 480px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .screen.active {
            display: block;
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-area h1 {
            color: var(--primary);
            margin: 0;
            font-size: 32px;
            letter-spacing: 1px;
        }
        .logo-area p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 5px 0 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }
        .btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-bottom: 10px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .google-btn {
            background: white;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
        }
        .timer-box {
            background: #0f172a;
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .timer-box span {
            color: var(--primary);
            font-weight: bold;
            font-size: 16px;
        }
        .summary-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .logout-btn {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN / SIGNUP SCREEN -->
    <div id="loginScreen" class="screen active">
        <div class="logo-area">
            <h1>EUROPE DRAW</h1>
            <p>The Ultimate Secure European Lucky Draw Platform</p>
        </div>
        <h2>Welcome Back</h2>
        
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="name@example.com">

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">

        <button class="btn" onclick="handleLogin()">Login to Account</button>
        
        <div style="text-align: center; margin: 15px 0; color: var(--text-muted); font-size: 13px;">OR</div>

        <button class="btn google-btn" onclick="handleLogin()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.18v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.18C.43 8.1 0 9.8 0 12s.43 3.9 1.18 5.42l4.1-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.18 6.58l4.1 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
            Continue with Google Gmail
        </button>
    </div>

    <!-- 2. DASHBOARD / TICKET PURCHASE SCREEN -->
    <div id="dashboardScreen" class="screen">
        <div class="logo-area">
            <h1>EUROPE DRAW</h1>
            <p>Logged in as: <span id="userDisplayEmail" style="color: var(--primary);"></span></p>
        </div>

        <!-- Live Countdown Timer -->
        <div class="timer-box">
            <div>Next Mega Draw In:</div>
            <span id="countdown">05 Days : 14 Hrs : 32 Mins : 45 Secs</span>
        </div>

        <h3 style="color: var(--primary); font-size: 16px; border-bottom: 1px solid #334155; padding-bottom: 5px;">🎫 Buy Lucky Tickets</h3>
        
        <label>Number of Tickets (€15.00 each)</label>
        <input type="number" id="ticketCount" value="1" min="1" oninput="calculateTotal()">

        <label>Payment Method (Mastercard / Visa Gateway)</label>
        <select id="cardType" onchange="calculateTotal()">
            <option value="eu">European Mastercard (Fee: 1.5% + €0.25)</option>
            <option value="intl">International Mastercard (Fee: 3.25% + €0.25)</option>
        </select>

        <div class="summary-box" id="priceSummary">
            Ticket Price: €15.00<br>
            Gateway Fee: €0.48<br>
            <strong>Total Amount: €15.48</strong>
        </div>

        <h3 style="color: var(--primary); font-size: 16px; border-bottom: 1px solid #334155; padding-bottom: 5px; margin-top: 20px;">💳 Secure Card Checkout</h3>
        
        <label>Cardholder Name</label>
        <input type="text" placeholder="As written on card">

        <label>Card Number</label>
        <input type="text" placeholder="5412 7500 3489 1234" maxlength="19">

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Expiry</label>
                <input type="text" placeholder="MM/YY" maxlength="5">
            </div>
            <div style="flex: 1;">
                <label>CVV</label>
                <input type="password" placeholder="123" maxlength="4">
            </div>
        </div>

        <button class="btn" onclick="alert('Success! Your payment was processed securely via Mastercard gateway and tickets have been issued.')">Pay Securely & Enter Draw</button>
        
        <button class="btn logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <script>
        function handleLogin() {
            let email = document.getElementById('loginEmail').value;
            if(!email) email = "user@gmail.com"; // Default for Google/Quick login simulation
            document.getElementById('userDisplayEmail').innerText = email;
